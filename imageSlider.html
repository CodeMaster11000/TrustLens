<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Slider</title>
    <style>
        *,
        *::after,
        *::before {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        img {
            display: block;
            max-width: 100%;
        }

        main {
            display: grid;
            place-items: center;
            min-height: 100vh;
            background-color: #0a0a0a;
        }

        .container {
            display: grid;
            place-content: center;
            position: relative;
            overflow: hidden;
            border-radius: 1rem;
            --position: 50%;
        }

        .image-container {
            width: 100%;
            max-width: 380px; 
            max-height: 90vh;
            position: relative;
        }

        .slider-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: left;
        }

        .image-before {
            position: absolute;
            inset: 0;
            width: var(--position);
            overflow: hidden;
            z-index: 10;
        }

        .slider {
            position: absolute;
            inset: 0;
            cursor: pointer;
            opacity: 0;
            height: 100%;
            width: 100%;
            z-index: 200;
        }

        .slider:focus-visible ~ .slider-button {
            outline: 3px solid #dc2626;
            outline-offset: 3px;
        } 

        .slider-line {
            position: absolute;
            inset: 0;
            width: .2rem;
            height: 100%;
            background-color: #dc2626;
            z-index: 100;
            left: var(--position);
            transform: translateX(-50%);
            pointer-events: none;
        }

        .slider-button {
            position: absolute;
            background-color: #171717;
            color: #ef4444;
            border: 1px solid #dc2626;
            padding: .5rem;
            border-radius: 100vw;
            display: grid;
            place-items: center;
            top: 50%;
            left: var(--position);
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 1000;
            box-shadow: 0 0 15px rgba(220, 38, 38, 0.5);
        }
    </style>
  </head>
  <body>
    <main>
      <div class="container">
        <div class="image-container">
          <div class="image-before">
             <img class="slider-image" src="before.png" />
          </div>
          <img class="after-image slider-image" src="after.png" />
        </div>
        <input type="range" min="0" max="100" value="50" class="slider" />
        <div class="slider-line"></div>
        <div class="slider-button">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            fill="currentColor"
            viewBox="0 0 256 256"
          >
            <path
              d="M136,40V216a8,8,0,0,1-16,0V40a8,8,0,0,1,16,0ZM96,120H35.31l18.35-18.34A8,8,0,0,0,42.34,90.34l-32,32a8,8,0,0,0,0,11.32l32,32a8,8,0,0,0,11.32-11.32L35.31,136H96a8,8,0,0,0,0-16Zm149.66,2.34-32-32a8,8,0,0,0-11.32,11.32L220.69,120H160a8,8,0,0,0,0,16h60.69l-18.35,18.34a8,8,0,0,0,11.32,11.32l32-32A8,8,0,0,0,245.66,122.34Z"
            ></path>
          </svg>
        </div>
      </div>
    </main>

    <script>
        const container = document.querySelector(".container");
        document.querySelector(".slider").addEventListener("input", (e) => {
            container.style.setProperty('--position', `${e.target.value}%`);
        });
    </script>
  </body>
</html>
